<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zerify · 画横线人机验证</title>
<style>
  :root { color-scheme: light; }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #0f172a;
    background:
      radial-gradient(900px 480px at 8% -10%, #dbeafe 0%, rgba(219,234,254,0) 70%),
      radial-gradient(800px 420px at 95% 110%, #dcfce7 0%, rgba(220,252,231,0) 70%),
      #f8fafc;
  }
  .card {
    width: 100%;
    max-width: 480px;
    padding: 30px 28px 26px;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 28px 60px -32px rgba(15,23,42,.45), 0 0 0 1px rgba(15,23,42,.06);
  }
  .badge {
    display: inline-block;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #1d4ed8;
    background: #dbeafe;
    border-radius: 999px;
  }
  h1 { margin: 14px 0 8px; font-size: 22px; line-height: 1.3; }
  .card-head p { margin: 0 0 22px; font-size: 13.5px; line-height: 1.6; color: #64748b; }
  .field { margin-bottom: 16px; }
  .field label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: #334155; }
  .field input, .field textarea {
    width: 100%;
    padding: 10px 12px;
    font: inherit;
    font-size: 14px;
    color: #0f172a;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  .field input:focus, .field textarea:focus {
    background: #fff;
    border-color: #93c5fd;
    box-shadow: 0 0 0 3px rgba(147,197,253,.35);
  }
  .field textarea { resize: vertical; min-height: 72px; }
  .actions { display: flex; gap: 10px; margin-top: 20px; }
  .actions button {
    flex: 1;
    padding: 11px 18px;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    border-radius: 10px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: transform .12s, box-shadow .15s, background .15s, border-color .15s;
  }
  #submit-btn { color: #fff; background: #2563eb; box-shadow: 0 10px 22px -12px rgba(37,99,235,.9); }
  #submit-btn:hover:not(:disabled) { background: #1d4ed8; }
  #submit-btn:active:not(:disabled) { transform: translateY(1px); }
  #submit-btn:disabled { color: #94a3b8; background: #e2e8f0; box-shadow: none; cursor: not-allowed; }
  .ghost { color: #334155; background: #fff; border-color: #e2e8f0; }
  .ghost:hover { background: #f8fafc; border-color: #cbd5e1; }
  .result {
    margin-top: 18px;
    padding: 12px 14px;
    font-size: 13.5px;
    line-height: 1.6;
    color: #166534;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: 10px;
    word-break: break-word;
  }
</style>
</head>
<body>
  <main class="card">
    <header class="card-head">
      <div class="badge">Zerify</div>
      <h1>画横线人机验证</h1>
      <p>用鼠标或手指从左往右画一条尽量水平的横线。轨迹会经过长度、水平度、直线度与速度变化检测。</p>
    </header>

    <form id="demo-form" novalidate>
      <div class="field">
        <label for="nickname">昵称</label>
        <input id="nickname" name="nickname" type="text" autocomplete="nickname" placeholder="例如：夜航星">
      </div>

      <div class="field">
        <label for="message">留言</label>
        <textarea id="message" name="message" rows="3" placeholder="说点什么…"></textarea>
      </div>

      <div class="field">
        <label>人机验证</label>
        <div id="zerify"></div>
      </div>

      <div class="actions">
        <button type="submit" id="submit-btn" disabled>提交</button>
        <button type="button" id="reset-btn" class="ghost">重新验证</button>
      </div>
    </form>

    <div id="result" class="result" hidden></div>
  </main>

  <script src="zerify.js"></script>
  <script>
    (function () {
      var submitBtn = document.getElementById('submit-btn');
      var resetBtn = document.getElementById('reset-btn');
      var form = document.getElementById('demo-form');
      var result = document.getElementById('result');

      var verifier = new Zerify('#zerify', {
        onSuccess: function () {
          submitBtn.disabled = false;
        },
        onFail: function () {
          submitBtn.disabled = true;
        },
        onReset: function () {
          submitBtn.disabled = true;
        }
      });

      resetBtn.addEventListener('click', function () {
        verifier.reset();
        result.hidden = true;
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!verifier.isVerified()) {
          submitBtn.disabled = true;
          return;
        }

        var nameEl = document.getElementById('nickname');
        var msgEl = document.getElementById('message');
        var name = nameEl.value.trim() || '匿名访客';
        var msg = msgEl.value.trim() || '（没有留言）';

        result.hidden = false;
        result.textContent = '已提交 · ' + name + '：' + msg;

        form.reset();
        verifier.reset();
      });
    })();
  </script>
</body>
</html>
