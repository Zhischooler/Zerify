<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zerify Fixture</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 48px auto; padding: 0 16px; }
  label { display: block; margin: 12px 0 4px; font-size: 13px; color: #334155; }
  input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
  button { margin-top: 12px; padding: 8px 18px; }
</style>
</head>
<body>
  <h2>Zerify 测试页 Demo</h2>
  <form id="demo">
    <label for="name">昵称</label>
    <input id="name" name="name" type="text" required>
    <label for="msg">留言</label>
    <textarea id="msg" name="msg" rows="3"></textarea>
    <button type="submit">提交</button>
  </form>
</body>
</html>
